name: Lighthouse CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://findneuro.com
          uploadArtifacts: true
          budgetPath: .github/lighthouse-budget.json
