name: Optimize Images
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get install -y jpegoptim optipng
      - name: Optimize JPEGs
        run: find assets -name '*.jpg' -o -name '*.jpeg' | xargs -r jpegoptim --strip-all --max=85
      - name: Optimize PNGs
        run: find assets -name '*.png' | xargs -r optipng -o2
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "Optimize images [automated]" && git push
