name: HTML/CSS/JS Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        uses: nicohman/html5validator-action@v1
        with:
          root: .
          css: true
      - name: Check accessibility (axe)
        run: |
          npm install -g @axe-core/cli
          npx axe https://findneuro.com --exit
