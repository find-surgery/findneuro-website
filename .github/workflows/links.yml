name: Link Checker
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Weekly on Monday at 9am UTC

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Build site
        run: npm ci && npm run build
      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --root-dir dist --exclude 'linkedin\.com' --exclude 'doi\.org' --exclude 'd3js\.org' 'dist/**/*.html'
          fail: true
