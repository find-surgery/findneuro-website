name: Uptime Check
on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check site availability
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://findneuro.com)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Site returned HTTP $STATUS"
            exit 1
          fi
          echo "Site is up (HTTP 200)"
